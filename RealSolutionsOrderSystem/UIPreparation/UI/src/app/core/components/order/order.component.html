<div class="main-content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header card-header-danger">
                        <h4 class="card-title ">{{'OrderList'| translate}}</h4>
                        <a *ngIf="checkClaim('CreateOrderCommand')" class="pull-right" data-toggle="modal" data-target="#order">
                            <i style="color:white" title="{{'Add'| translate}}" class="far fa-plus-square fa-2x"></i>
                        </a>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <div class="col-md-4 pull-right">
                                <mat-form-field>
                                    <mat-label>Filter</mat-label>
                                    <input matInput (keyup)="applyFilter($event)" placeholder="" #input>
                                </mat-form-field>
                            </div>
                            <table mat-table [dataSource]="dataSource" matSort>

                                <ng-container matColumnDef="id">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header>{{'Id'|translate}}</th>
                                    <td mat-cell *matCellDef="let element">{{element.id}}</td>
                                </ng-container>

                                <ng-container matColumnDef="customerId">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Müşteri Id</th>
                                    <td mat-cell *matCellDef="let element">{{element.customerId}}</td>
                                </ng-container>

                                <ng-container matColumnDef="productId">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Ürün Id</th>
                                    <td mat-cell *matCellDef="let element">{{element.productId}}</td>
                                </ng-container>

                                <ng-container matColumnDef="quantity">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Sipariş Adedi</th>
                                    <td mat-cell *matCellDef="let element">{{element.quantity}}</td>
                                </ng-container>

                                <ng-container matColumnDef="createdDate">
                                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Sipariş Tarihi</th>
                                    <td mat-cell *matCellDef="let element">{{element.createdDate | date:'dd.MM.yyyy HH:mm'}}</td>
                                </ng-container>

                                <ng-container matColumnDef="update">
                                    <th mat-header-cell *matHeaderCellDef></th>
                                    <td style="width: 25px;" mat-cell *matCellDef="let element">
                                        <a *ngIf="checkClaim('UpdateOrderCommand')" data-toggle="modal" data-target="#order" (click)="getOrderById(element.id)">
                                            <i title="{{'Update'| translate}}" style="color:#ff5722;" class="far fa-edit"></i>
                                        </a>
                                    </td>
                                </ng-container>

                                <ng-container matColumnDef="delete">
                                    <th mat-header-cell *matHeaderCellDef></th>
                                    <td style="width: 25px;" mat-cell *matCellDef="let element">
                                        <a *ngIf="checkClaim('DeleteOrderCommand')" (confirm)="deleteOrder(element.id)" [swal]="deleteSwal">
                                            <i title="{{'Delete'| translate}}" style="color: #D9534E;" class="fas fa-trash-alt"></i>
                                        </a>
                                    </td>
                                </ng-container>

                                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                                <tr class="mat-row" *matNoDataRow style="text-align: center;">
                                    <td class="mat-cell" colspan="4">{{'NoRecordsFound' |translate}} "{{input.value}}"</td>
                                </tr>
                            </table>
                            <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]"></mat-paginator>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal modal-angular fade" id="order" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-body text-center">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="clearFormGroup(orderAddForm)">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="margin-top">Sipariş Oluştur</h4>
                <div class="separator"></div>
                <form *ngIf="orderAddForm" [formGroup]="orderAddForm" (ngSubmit)="save()">

                    <div class="row" style="margin-bottom: 15px;">
                        <div class="col col-md-12">
                            <label style="float: left; font-weight: bold;">Müşteri Seçiniz</label>
                            <select class="browser-default custom-select" formControlName="customerId">
                                <option *ngFor="let item of customerList" [ngValue]="item.id">{{item.customerName}}</option>
                            </select>
                        </div>
                    </div>

                    <div class="row" style="margin-bottom: 15px;">
                        <div class="col col-md-12">
                            <label style="float: left; font-weight: bold;">Ürün Seçiniz</label>
                            <select class="browser-default custom-select" formControlName="productId">
                                <option *ngFor="let item of productList" [ngValue]="item.id">{{item.name}}</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col col-md-12">
                            <mat-form-field class="example-full-width">
                                <input matInput placeholder="Sipariş Adedi (Quantity)" type="number" min="1" id="quantity" name="quantity" formControlName="quantity" />
                            </mat-form-field>
                        </div>
                    </div>

                    <button mat-raised-button type="submit" class="btn btn-danger pull-right">{{'Save'|translate}}</button>
                    <div class="clearfix"></div>
                </form>
            </div>
        </div>
    </div>
</div>

<swal #deleteSwal title="{{'DeleteConfirm' | translate}}" icon="error" [showCancelButton]="true"
      [confirmButtonText]="'OK'" [cancelButtonText]="'Cancel'">
</swal>
